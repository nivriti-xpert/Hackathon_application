<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurakshaGrid</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800">

    <header class="bg-white border-b border-slate-200">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">

            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center text-lg">☀️</div>
                <div>
                    <h1 class="font-bold text-slate-900">SurakshaGrid</h1>
                    <p class="text-xs text-slate-500">Safer streets for women, powered by the sun</p>
                </div>
                <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neighborhood Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#222}
.page{max-width:1000px;margin:0 auto;padding:20px;display:flex;flex-wrap:wrap;gap:20px}
.left{flex:2;min-width:300px}
.right{flex:1;min-width:260px}
.banner{background:#4f6df5;color:#fff;border-radius:14px;padding:18px;margin-bottom:20px}
.banner h1{margin:0 0 6px;font-size:20px}
.banner p{margin:0;font-size:14px}
.card{background:#fff;border:1px solid #dde2ea;border-radius:14px;padding:16px;margin-bottom:20px}
.card h2{margin:0 0 12px;font-size:16px}
#map{height:380px;border-radius:10px}
label{display:block;font-size:13px;font-weight:bold;margin:10px 0 4px}
input,select{width:100%;padding:9px;border:1px solid #ccd2dc;border-radius:8px;font-size:14px}
button{width:100%;margin-top:14px;padding:11px;background:#4f6df5;color:#fff;border:0;border-radius:8px;font-size:15px;cursor:pointer}
button:hover{background:#3b57e0}
#list{max-height:240px;overflow-y:auto}
.note{background:#f6f8fb;border:1px solid #e3e7ee;border-radius:10px;padding:10px;margin-bottom:10px;font-size:14px}
.note small{color:#777}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#e4e9fb;margin-bottom:4px}
</style>
</head>
<body>

<div class="page">

<div class="left">
<div class="banner">
<h1>Welcome to our neighborhood map 🌳</h1>
<p>See what's happening nearby, report a broken streetlamp, or share a lost pet alert.</p>
</div>
<div class="card">
<h2>Neighborhood activity</h2>
<div id="map"></div>
</div>
</div>

<div class="right">
<div class="card">
<h2>Add a note</h2>
<form id="noteForm">
<label for="what">What happened?</label>
<input id="what" required placeholder="e.g. Streetlamp is flickering">

<label for="kind">Category</label>
<select id="kind">
<option>Streetlight</option>
<option>Lost Pet</option>
<option>Suspicious Activity</option>
<option>General</option>
</select>

<label for="where">Where?</label>
<input id="where" required placeholder="e.g. Near the park gate">

<button type="submit">Post to map</button>
</form>
</div>

<div class="card">
<h2>Recent notes</h2>
<div id="list"></div>
</div>
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
var notes = [
  { what: 'Streetlight working fine', kind: 'Streetlight', where: 'Maple Street', lat: 12.9716, lng: 77.5946, when: '10 mins ago' },
  { what: 'Friendly dog wandering in the park', kind: 'Lost Pet', where: 'Community Park', lat: 12.9750, lng: 77.6050, when: '1 hour ago' },
  { what: 'Car parked with lights on for hours', kind: 'Suspicious Activity', where: 'Pine Lane', lat: 12.9650, lng: 77.5850, when: '3 hours ago' }
]

var map = L.map('map').setView([12.9716, 77.5946], 14)
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map)

function showNotes() {
  var list = document.getElementById('list')
  list.innerHTML = ''

  for (var i = 0; i < notes.length; i++) {
    var n = notes[i]
    var div = document.createElement('div')
    div.className = 'note'
    div.innerHTML = '<span class="tag"></span><br><b></b><br><small></small>'
    div.querySelector('.tag').textContent = n.kind
    div.querySelector('b').textContent = n.what
    div.querySelector('small').textContent = n.where + ' · ' + n.when
    list.appendChild(div)
  }
}

function addPinToMap(n) {
  var text = document.createElement('div')
  text.innerHTML = '<b></b><br><span></span>'
  text.querySelector('b').textContent = n.what
  text.querySelector('span').textContent = n.where
  L.marker([n.lat, n.lng]).addTo(map).bindPopup(text)
}

document.getElementById('noteForm').addEventListener('submit', function (event) {
  event.preventDefault()

  var newNote = {
    what: document.getElementById('what').value,
    kind: document.getElementById('kind').value,
    where: document.getElementById('where').value,
    lat: 12.9716 + (Math.random() - 0.5) * 0.02,
    lng: 77.5946 + (Math.random() - 0.5) * 0.02,
    when: 'Just now'
  }

  notes.unshift(newNote)
  addPinToMap(newNote)
  showNotes()
  this.reset()
})

for (var i = 0; i < notes.length; i++) {
  addPinToMap(notes[i])
}
showNotes()
</script>

</body>
</html>
